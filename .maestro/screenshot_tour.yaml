appId: de.fokuspunk.cidpbuddy
---

# ══════════════════════════════════════════════════════════
#  CIDPbuddy – Screenshot- & Screen-Recording-Tour
#  Ausführen: maestro record .maestro/screenshot_tour.yaml
#              maestro test  .maestro/screenshot_tour.yaml
# ══════════════════════════════════════════════════════════

# ── Phase 1: App-Start ───────────────────────────────────

- launchApp:
    clearState: false

# App braucht nach Cold-Start einige Sekunden bis der erste Frame steht.
# Auf echten Dashboard-Inhalt warten, bevor irgendetwas angetippt wird.
- extendedWaitUntil:
    visible: "Deine Übersicht"
    timeout: 30000

- waitForAnimationToEnd
- takeScreenshot: screenshots/01_dashboard_leer

# ── Phase 2: Medikament anlegen ──────────────────────────
# Glas-Bottom-Nav ist NICHT im Semantics-Tree -> Koordinaten.
# 4 Slots (x): 12% / 37% / 62% / 88%, Flutter-Nav bei y=92%.

- tapOn:
    point: "62%,92%"
- waitForAnimationToEnd
- takeScreenshot: screenshots/02_medikation_leer

- tapOn:
    text: "Hinzufügen"
- waitForAnimationToEnd
- takeScreenshot: screenshots/03_neues_element_formular

- tapOn:
    text: "Medikamentenname"
- inputText: "Hizentra"

- tapOn:
    text: "Dosis / Stärke"
- inputText: "10g"

- tapOn:
    text: "Anfangsbestand"
- eraseText: 20
- inputText: "10"

- tapOn:
    text: "Standard-Nachbestellmenge"
- eraseText: 20
- inputText: "10"

- tapOn:
    text: "Warnschwelle (in Tagen)"
- eraseText: 20
- inputText: "14"

- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: screenshots/04_medikament_ausgefuellt

- tapOn:
    text: "Speichern"
- waitForAnimationToEnd
- takeScreenshot: screenshots/05_infusionsplan_erstellen

# scrollUntilVisible scrollt die Flutter-SingleChildScrollView NICHT zuverlässig:
# der Button-Sliver am unteren Rand gilt sofort als "sichtbar", es wird gar nicht
# gescrollt und der Tap landet auf dem abgeschnittenen Button (= keine Reaktion).
# Darum eine echte Wisch-Geste, bis der Button vollständig im tappbaren Bereich liegt.
- swipe:
    start: "50%,70%"
    end: "50%,25%"
    duration: 500
- waitForAnimationToEnd
- tapOn:
    text: "Zeitplan aktivieren"
# Bestätigen, dass der Tap die Seite wirklich verlassen hat. Sonst läuft der
# Flow auf der Plan-Seite weiter und alle Folge-Schritte (Dashboard etc.)
# schlagen mit irreführenden "not found"-Fehlern fehl.
- extendedWaitUntil:
    notVisible: "Zeitplan aktivieren"
    timeout: 10000
- waitForAnimationToEnd

# ── Phase 3: Dashboard-Tour ──────────────────────────────

- tapOn:
    point: "12%,92%"
# Warten bis das Dashboard (und damit der "Termin planen"-FAB) wirklich da ist.
- extendedWaitUntil:
    visible: "Termin planen"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: screenshots/06_dashboard

- swipe:
    direction: DOWN
    duration: 800
- waitForAnimationToEnd
- takeScreenshot: screenshots/07_dashboard_scrolled
- swipe:
    direction: UP
    duration: 500
- waitForAnimationToEnd

- tapOn:
    text: "Termin planen"
- waitForAnimationToEnd
- takeScreenshot: screenshots/08_termin_planen_dialog
- pressKey: Back
- waitForAnimationToEnd

# ── Phase 4: Tagebuch-Tour ───────────────────────────────

- tapOn:
    point: "37%,92%"
- waitForAnimationToEnd
- takeScreenshot: screenshots/09_tagebuch

- swipe:
    direction: DOWN
    duration: 800
- waitForAnimationToEnd
- takeScreenshot: screenshots/10_tagebuch_scrolled
- swipe:
    direction: UP
    duration: 500
- waitForAnimationToEnd

- tapOn:
    text: "Vitalwerte & Symptome"
- waitForAnimationToEnd
- takeScreenshot: screenshots/11_vitalwerte_formular

- swipe:
    direction: DOWN
    duration: 600
- waitForAnimationToEnd
- takeScreenshot: screenshots/12_vitalwerte_formular_scrolled

- pressKey: Back
- waitForAnimationToEnd

- tapOn:
    text: "Infusion erfassen"
- waitForAnimationToEnd
- takeScreenshot: screenshots/13_infusion_erfassen

- tapOn:
    text: "Medikament wählen"
- waitForAnimationToEnd
- tapOn:
    text: "Hizentra"
- waitForAnimationToEnd

- tapOn:
    text: "Dosierung / Einheiten"
- eraseText: 20
- inputText: "1.0"

- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: screenshots/14_infusion_ausgefuellt

- pressKey: Back
- waitForAnimationToEnd

# ── Phase 5: Medikation-Tour ─────────────────────────────

- tapOn:
    point: "62%,92%"
- waitForAnimationToEnd
- takeScreenshot: screenshots/15_medikation

# Die Medikamenten-Kachel ist eine getappte ListTile -> Flutter merged Titel,
# Dosis-Badge und Untertitel zu EINEM Accessibility-Node mit Label
# "Hizentra\n20%\nPZN: ". Maestros text-Selector macht einen Voll-String-Match,
# darum matcht "Hizentra" allein nicht. (?s) erlaubt das . über Zeilenumbrüche.
- tapOn:
    text: "(?s)Hizentra.*"
- waitForAnimationToEnd
- takeScreenshot: screenshots/16_hizentra_details

- swipe:
    direction: DOWN
    duration: 600
- waitForAnimationToEnd
- takeScreenshot: screenshots/17_hizentra_details_scrolled

- pressKey: Back
- waitForAnimationToEnd

- tapOn:
    text: "Abgesetzte Medikamente"
- waitForAnimationToEnd
- takeScreenshot: screenshots/18_abgesetzte_medikamente
- pressKey: Back
- waitForAnimationToEnd

- tapOn:
    text: "Hinzufügen"
- waitForAnimationToEnd

# Die Kategorie ist jetzt ein Dropdown (Button-Node "Kategorie\nMedikament"),
# kein Umschalter mehr. Erst das Dropdown öffnen, dann "Verbrauchsmaterial"
# aus der geöffneten Liste wählen.
- tapOn:
    text: "(?s)Kategorie.*"
- tapOn:
    text: "Verbrauchsmaterial"
- waitForAnimationToEnd

# Maestros inputText kann keine Umlaute tippen (adb-Text-Input ist ASCII-only,
# siehe maestro #146) -> ASCII-Name verwenden. "Tupfer" passt als Infusions-
# Verbrauchsmaterial und sieht im Screenshot korrekt aus.
- tapOn:
    text: "Medikamentenname"
- inputText: "Tupfer"

- tapOn:
    text: "Anfangsbestand"
- eraseText: 20
- inputText: "50"

- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: screenshots/19_verbrauchsmaterial_formular

- tapOn:
    text: "Speichern"
- waitForAnimationToEnd
- takeScreenshot: screenshots/20_medikation_komplett

# ── Phase 6: Einstellungen-Tour ──────────────────────────

- tapOn:
    point: "88%,92%"
- waitForAnimationToEnd
- takeScreenshot: screenshots/21_einstellungen

- swipe:
    direction: DOWN
    duration: 800
- waitForAnimationToEnd
- takeScreenshot: screenshots/22_einstellungen_scrolled
- swipe:
    direction: UP
    duration: 500
- waitForAnimationToEnd

# ── Finale ───────────────────────────────────────────────

- tapOn:
    point: "12%,92%"
- waitForAnimationToEnd
- takeScreenshot: screenshots/23_dashboard_final
