name: Release

on:
  push:
    tags:
      - 'v*'

# A tag must not be able to publish a release that does not analyze, translate
# or test cleanly — the verify job below is the same one CI runs on every PR.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ─── Gate ───────────────────────────────────────────────────────────────────
  verify:
    name: Verify
    # The release build compiles the app anyway, so skip CI's debug APK job.
    uses: ./.github/workflows/ci.yml
    with:
      skip-android-build: true

  # ─── Android ────────────────────────────────────────────────────────────────
  android-build:
    name: Build & Release Android
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Extract version from tag
        id: get_version
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}
          if [[ $VERSION == *"+"* ]]; then
            BUILD_NAME=${VERSION%+*}
            BUILD_NUMBER=${VERSION#*+}
          else
            BUILD_NAME=$VERSION
            BUILD_NUMBER=${{ github.run_number }}
          fi
          echo "build_name=$BUILD_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in sync with FLUTTER_VERSION in ci.yml — releases must be
          # built with the version CI verified against.
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Set build timestamp
        run: |
          TS=$(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')
          cat > lib/core/constants/build_config.dart <<EOF
          class BuildConfig {
            static const String buildTimestamp = '$TS';
          }
          EOF

      # Every runner generates a fresh debug keystore, so an APK signed with it
      # carries a different key on each release and cannot be installed over
      # the previous one without uninstalling — which deletes the patient's
      # local database. Refuse to build rather than ship that.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set — see docs/Building-and-Releasing.md, 'CI/CD signing'."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/cidpbuddy-release.jks
          cat > android/key.properties <<EOF
          keyAlias=$KEYSTORE_ALIAS
          keyPassword=$KEY_PASSWORD
          storePassword=$STORE_PASSWORD
          storeFile=../cidpbuddy-release.jks
          EOF

      - name: Build APK
        env:
          # Makes android/app/build.gradle.kts fail instead of falling back to
          # the debug key when key.properties is missing.
          ORG_GRADLE_PROJECT_requireReleaseSigning: 'true'
        run: |
          flutter build apk --release \
            --build-name=${{ steps.get_version.outputs.build_name }} \
            --build-number=${{ steps.get_version.outputs.build_number }}

      - name: Verify release signature
        run: |
          if keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk \
               | grep -q 'CN=Android Debug'; then
            echo "::error::The APK is signed with the debug key."
            exit 1
          fi

      - name: Rename APK with app name & version
        id: rename_apk
        run: |
          APK_NAME="CIDPbuddy-${{ steps.get_version.outputs.build_name }}+${{ steps.get_version.outputs.build_number }}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/$APK_NAME"
          echo "apk_path=build/app/outputs/flutter-apk/$APK_NAME" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename_apk.outputs.apk_path }}
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.get_version.outputs.build_name }} (Build ${{ steps.get_version.outputs.build_number }})
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── iOS ────────────────────────────────────────────────────────────────────
  # Disabled: App Store Connect secret missing — re-enable once secrets are restored
  ios-build:
    name: Build & Release iOS
    runs-on: macos-latest
    needs: verify
    if: false  # disabled until App Store Connect secrets are available
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Extract version from tag
        id: get_version
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}
          if [[ $VERSION == *"+"* ]]; then
            BUILD_NAME=${VERSION%+*}
            BUILD_NUMBER=${VERSION#*+}
          else
            BUILD_NAME=$VERSION
            BUILD_NUMBER=${{ github.run_number }}
          fi
          echo "build_name=$BUILD_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in sync with FLUTTER_VERSION in ci.yml — releases must be
          # built with the version CI verified against.
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      # ── Code-Signing ────────────────────────────────────────────────────────
      - name: Import distribution certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(security cms -D -i "$PP_PATH" | plutil -extract UUID raw -)
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Generate ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          # Extract profile name from the decoded plist
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_NAME=$(security cms -D -i "$PP_PATH" | plutil -extract Name raw -)

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>de.fokuspunk.cidpbuddy</key>
                  <string>${PROFILE_NAME}</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Build IPA
        run: |
          flutter build ipa --release \
            --build-name=${{ steps.get_version.outputs.build_name }} \
            --build-number=${{ steps.get_version.outputs.build_number }} \
            --export-options-plist=ios/ExportOptions.plist

      # ── Upload ──────────────────────────────────────────────────────────────
      - name: Upload to TestFlight
        env:
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_CONTENT" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8

          IPA_PATH="$(find build/ios/ipa -name '*.ipa' | head -1)"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID" \
            --verbose

      - name: Rename IPA with app name & version
        id: rename_ipa
        run: |
          IPA_SRC="$(find build/ios/ipa -name '*.ipa' | head -1)"
          IPA_NAME="CIDPbuddy-${{ steps.get_version.outputs.build_name }}+${{ steps.get_version.outputs.build_number }}.ipa"
          mv "$IPA_SRC" "build/ios/ipa/$IPA_NAME"
          echo "ipa_path=build/ios/ipa/$IPA_NAME" >> $GITHUB_OUTPUT

      - name: Attach IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename_ipa.outputs.ipa_path }}
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
