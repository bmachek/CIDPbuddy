name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip-android-build:
        description: 'Skip the debug APK build (the release workflow compiles it anyway)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pinned so CI matches the version the app is developed and released with.
  # Dependabot cannot bump this — raise it by hand together with the SDK.
  FLUTTER_VERSION: '3.44.6'

jobs:
  verify:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Regenerates Drift and l10n code, fails if the committed output is
      # stale, checks every ARB is fully translated, then analyzes and tests.
      - name: Verify
        run: tool/verify.sh --check-generated

  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    needs: verify
    # Phrased as a skip flag on purpose: for push/pull_request the `inputs`
    # context is null, and GitHub coerces both null and false to 0, so
    # `inputs.build-android != false` would silently skip this job on every PR.
    if: ${{ !inputs.skip-android-build }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      # The analyzer does not catch everything the Gradle/Kotlin build does —
      # a broken release build has shipped before (tag v1.8.1).
      - name: Build debug APK
        run: flutter build apk --debug
