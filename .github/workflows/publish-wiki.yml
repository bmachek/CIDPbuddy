name: Publish Wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:

concurrency:
  group: publish-wiki
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-wiki:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Clone wiki repository
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git wiki

      - name: Sync docs to wiki
        run: |
          # Drop wiki pages whose source file no longer exists, so renamed or
          # deleted docs do not linger as orphans, then copy the current set.
          for page in wiki/*.md; do
            [ -e "$page" ] || continue
            name="$(basename "$page")"
            if [ ! -f "docs/$name" ]; then
              echo "Removing stale wiki page: $name"
              git -C wiki rm --quiet "$name"
            fi
          done
          cp docs/*.md wiki/

      - name: Commit and push changes
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to wiki, skipping push."
          else
            git commit -m "docs: sync wiki from /docs [skip ci]"
            git push
          fi
