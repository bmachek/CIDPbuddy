name: Bug report
description: Something in the app behaves incorrectly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please redact real health
        data (medication names, dates, notes) from screenshots and logs.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. See …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About shows the version and build timestamp.
      placeholder: '1.9.7 (build 42)'
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - macOS
        - Windows
        - Linux
        - Web
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: 'Pixel 7, Android 15'

  - type: dropdown
    id: language
    attributes:
      label: App language
      options:
        - English
        - German
        - French
        - Italian
        - Spanish
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, logs, or whether it started after an update.
